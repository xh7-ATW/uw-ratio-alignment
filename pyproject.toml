[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-ratio-alignment"
version = "0.1.0"
description = "Reproducible u-w ratio alignment experiments for MuonL and t-MuonL."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]
